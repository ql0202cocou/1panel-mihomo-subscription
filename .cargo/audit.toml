# cargo-audit configuration. See: https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# Each ignored advisory below has been individually assessed as not reachable in
# this crate's actual (sqlite-only, native-tls) build. Re-evaluate on every
# dependency bump.
[advisories]
ignore = [
    # rsa Marvin timing side-channel. Pulled only by sqlx-mysql, which is NOT
    # enabled (we use sqlx features = ["sqlite", "runtime-tokio"]). `cargo tree
    # -i rsa` is empty and rsa is never compiled into the binary. No fixed
    # upgrade is available upstream.
    "RUSTSEC-2023-0071",
]

# serde_yaml is unmaintained upstream (deprecated since 0.9.34). Assessed:
# deferred migration — usage is wide (converter/yaml layer), and src/yaml.rs
# already provides an independent defense layer (anchor/alias counting plus
# depth/node limits) in front of parsing. No RUSTSEC advisory id exists for
# serde_yaml itself (RUSTSEC-2025-0068 covers the different `serde_yml`
# crate), so this is recorded as a comment only. Re-evaluate on dependency
# bumps.
