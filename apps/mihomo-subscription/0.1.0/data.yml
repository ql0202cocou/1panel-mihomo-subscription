      label:
        en: Log Level
        zh: 日志级别
        zh-Hant: 日誌級別
        ja: ログレベル
        ms: Tahap Log
        pt-br: Nível de Log
        ru: Уровень логов
        ko: 로그 레벨
      required: true
      type: select
      values:
        - label: debug
          value: debug
        - label: info
          value: info
        - label: warn
          value: warn
        - label: error
          value: error
