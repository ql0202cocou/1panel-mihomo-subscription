additionalProperties:
  formFields:
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      label:
        en: Web Port
        zh: Web 端口
        zh-Hant: Web 埠
        ja: Web ポート
        ms: Port Web
        pt-br: Porta Web
        ru: Web-порт
        ko: 웹 포트
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: ADMIN_USERNAME
      label:
        en: Admin Username
        zh: 管理员账号
        zh-Hant: 管理員帳號
        ja: 管理者ユーザー名
        ms: Nama Pengguna Admin
        pt-br: Usuário Admin
        ru: Имя администратора
        ko: 관리자 계정
      required: true
      type: text
    - default: ""
      edit: true
      envKey: ADMIN_PASSWORD
      label:
        en: Admin Password
        zh: 管理员密码
        zh-Hant: 管理員密碼
        ja: 管理者パスワード
        ms: Kata Laluan Admin
        pt-br: Senha Admin
        ru: Пароль администратора
        ko: 관리자 비밀번호
      required: true
      type: password
    - default: ""
      edit: true
      envKey: PUBLIC_BASE_URL
      label:
        en: Public Base URL (e.g. https://sub.example.com)
        zh: 公网访问地址(如 https://sub.example.com)
        zh-Hant: 公網存取位址(如 https://sub.example.com)
        ja: 公開ベース URL(例 https://sub.example.com)
        ms: URL Asas Awam (cth. https://sub.example.com)
        pt-br: URL Base Pública (ex. https://sub.example.com)
        ru: Публичный базовый URL (напр. https://sub.example.com)
        ko: "공개 기본 URL (예: https://sub.example.com)"
      required: true
      type: text
    - default: ""
      edit: true
      envKey: PUBLIC_PATH_PREFIX
      label:
        en: Public Path Prefix (optional, random if empty)
        zh: 公开路径前缀(可选,留空则随机)
        zh-Hant: 公開路徑前綴(可選,留空則隨機)
        ja: 公開パスのプレフィックス(任意、空ならランダム)
        ms: Awalan Laluan Awam (pilihan, rawak jika kosong)
        pt-br: Prefixo de Caminho Público (opcional, aleatório se vazio)
        ru: Префикс публичного пути (необязательно, случайный если пусто)
        ko: 공개 경로 접두사 (선택, 비우면 임의 생성)
      required: false
      type: text
    - default: info
      edit: true
      envKey: RUST_LOG
      label:
        en: Log Level
        zh: 日志级别
        zh-Hant: 日誌級別
        ja: ログレベル
        ms: Tahap Log
        pt-br: Nível de Log
        ru: Уровень логов
        ko: 로그 레벨
      required: true
      type: select
      values:
        - label: debug
          value: debug
        - label: info
          value: info
        - label: warn
          value: warn
        - label: error
          value: error
    - default: 15
      edit: true
      envKey: FETCH_TIMEOUT_SECONDS
      label:
        en: Provider Fetch Timeout (seconds)
        zh: 订阅拉取超时(秒)
        zh-Hant: 訂閱拉取逾時(秒)
        ja: サブスクリプション取得タイムアウト(秒)
        ms: Tamat Masa Ambil Langganan (saat)
        pt-br: Tempo Limite de Busca (segundos)
        ru: Тайм-аут загрузки подписки (сек)
        ko: 구독 가져오기 제한시간(초)
      required: true
      type: number
    - default: 8
      edit: true
      envKey: MAX_SUBSCRIPTION_SIZE_MB
      label:
        en: Max Subscription Size (MB)
        zh: 订阅大小上限(MB)
        zh-Hant: 訂閱大小上限(MB)
        ja: サブスクリプション最大サイズ(MB)
        ms: Saiz Langganan Maksimum (MB)
        pt-br: Tamanho Máximo da Assinatura (MB)
        ru: Макс. размер подписки (МБ)
        ko: 구독 최대 크기(MB)
      required: true
      type: number
    - default: 15
      edit: true
      envKey: CACHE_TTL_MINUTES
      label:
        en: Cache TTL (minutes)
        zh: 缓存有效期(分钟)
        zh-Hant: 快取有效期(分鐘)
        ja: キャッシュ TTL(分)
        ms: TTL Cache (minit)
        pt-br: TTL do Cache (minutos)
        ru: TTL кэша (мин)
        ko: 캐시 TTL(분)
      required: true
      type: number
    - default: 1
      edit: true
      envKey: TRUSTED_PROXY_HOPS
      label:
        en: Trusted Reverse-Proxy Hops
        zh: 可信反向代理层数
        zh-Hant: 可信反向代理層數
        ja: 信頼するリバースプロキシ段数
        ms: Lompatan Proksi Balikan Dipercayai
        pt-br: Saltos de Proxy Reverso Confiáveis
        ru: Доверенные прыжки обратного прокси
        ko: 신뢰하는 리버스 프록시 홉 수
      required: true
      type: number
    - default: auto
      edit: true
      envKey: SECURE_COOKIES
      label:
        en: Secure Session Cookies
        zh: 安全会话 Cookie
        zh-Hant: 安全工作階段 Cookie
        ja: セキュアセッション Cookie
        ms: Kuki Sesi Selamat
        pt-br: Cookies de Sessão Seguros
        ru: Безопасные cookie сессии
        ko: 보안 세션 쿠키
      required: false
      type: select
      values:
        - label: auto (infer from PUBLIC_BASE_URL)
          value: auto
        - label: "true"
          value: "true"
        - label: "false"
          value: "false"
